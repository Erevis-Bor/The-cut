nd Eternal Sunshine.","depth":"familiar"},{"id":"film-swiss-army-man","title":"Swiss Army Man","year":2016,"type":"film","genres":["Comedy","Drama","Surreal"],"moods":["Weird","Emotional"],"lane":"Wildcard","synopsis":"A stranded man befriends a corpse whose impossible abilities lead them on an unlikely journey.","why":"Its deeply odd mix of vulnerability and absurdity makes it an adventurous next step after Frank.","depth":"deep"},{"id":"film-little-miss-sunshine","title":"Little Miss Sunshine","year":2006,"type":"film","genres":["Comedy","Drama"],"moods":["Funny","Emotional","Feel-good"],"lane":"For you","synopsis":"An eccentric family drives a failing van across America for their daughter's beauty pageant.","why":"You respond to messy people, sharp laughs and earned warmth; this combines all three.","depth":"familiar"},{"id":"film-being-john-malkovich","title":"Being John Malkovich","year":1999,"type":"film","genres":["Surreal","Comedy","Drama"],"moods":["Weird","Clever"],"lane":"Essential","synopsis":"A puppeteer discovers a portal allowing visitors to inhabit an actor's mind for fifteen minutes.","why":"Your positive rating confirms a taste for bold identity-bending premises, even without an emotional home run.","depth":"familiar"},{"id":"film-everything-everywhere-all-at-once","title":"Everything Everywhere All at Once","year":2022,"type":"film","genres":["Sci-fi","Comedy","Adventure"],"moods":["Weird","Emotional","Clever"],"lane":"Essential","synopsis":"A struggling laundromat owner is swept into a multiverse crisis involving alternate versions of her life.","why":"A confirmed favourite: huge imagination, ferocious silliness and a moving emotional core.","depth":"familiar"},{"id":"film-the-lobster","title":"The Lobster","year":2015,"type":"film","genres":["Surreal","Comedy","Romance"],"moods":["Weird","Dark","Clever"],"lane":"Wildcard","synopsis":"Single adults at a remote hotel face an absurd deadline to find love or become animals.","why":"Your liking for its discomfort suggests risk-taking is welcome, though cold surrealism alone isn't enough.","depth":"deep"},{"id":"film-her","title":"Her","year":2013,"type":"film","genres":["Sci-fi","Romance","Drama"],"moods":["Emotional","Clever","Atmospheric"],"lane":"For you","synopsis":"A lonely writer develops a relationship with a sophisticated artificial intelligence voice.","why":"Your positive response points to thoughtful technology stories grounded in human longing.","depth":"familiar"},{"id":"film-in-bruges","title":"In Bruges","year":2008,"type":"film","genres":["Comedy","Crime","Drama"],"moods":["Dark","Funny","Emotional"],"lane":"For you","synopsis":"Two hitmen hide in a Belgian town as guilt, boredom and a botched job catch up with them.","why":"A confirmed favourite and almost a template for your taste in savage humour with unexpected heart.","depth":"familiar"},{"id":"film-parasite","title":"Parasite","year":2019,"type":"film","genres":["Thriller","Comedy","Drama"],"moods":["Dark","Gripping","Clever"],"lane":"Essential","synopsis":"An impoverished family infiltrates a wealthy household through increasingly elaborate deceptions.","why":"Your love for its razor-sharp storytelling confirms social satire and suspense make a powerful combination.","depth":"familiar"},{"id":"film-the-secret-life-of-walter-mitty","title":"The Secret Life of Walter Mitty","year":2013,"type":"film","genres":["Adventure","Comedy","Drama"],"moods":["Feel-good","Emotional","Escape"],"lane":"For you","synopsis":"A daydreaming photo editor finally ventures into the world to find a missing photograph.","why":"Your love of its wonder and movement is a crucial counterweight to the darker side of your taste.","depth":"familiar"},{"id":"film-get-out","title":"Get Out","year":2017,"type":"film","genres":["Horror","Mystery","Thriller"],"moods":["Dark","Gripping","Clever"],"lane":"Essential","synopsis":"A young man visits his girlfriend's family and uncovers disturbing secrets behind their hospitality.","why":"You liked its socially charged mystery; a good sign for idea-driven horror with real narrative payoff.","depth":"familiar"},{"id":"film-whiplash","title":"Whiplash","year":2014,"type":"film","genres":["Drama","Music"],"moods":["Gripping","Dark"],"lane":"Essential","synopsis":"An ambitious young drummer enters a brutal contest of wills with his demanding teacher.","why":"Your positive rating supports intense character battles, although intensity itself doesn't guarantee love.","depth":"familiar"},{"id":"film-eternal-sunshine-of-the-spotless-mind","title":"Eternal Sunshine of the Spotless Mind","year":2004,"type":"film","genres":["Romance","Sci-fi","Drama"],"moods":["Emotional","Weird","Clever"],"lane":"For you","synopsis":"Former lovers undergo a procedure to erase each other, only for memories to resist oblivion.","why":"One of your favourites and a key anchor for strange premises with an enormous emotional payoff.","depth":"familiar"},{"id":"film-into-the-wild","title":"Into the Wild","year":2007,"type":"film","genres":["Adventure","Drama"],"moods":["Escape","Emotional","Atmospheric"],"lane":"For you","synopsis":"A young graduate abandons convention to travel across America and live on his own terms.","why":"Your affection for searching, aspirational journeys makes this a defining part of your profile.","depth":"familiar"},{"id":"film-frank","title":"Frank","year":2014,"type":"film","genres":["Comedy","Drama","Music"],"moods":["Weird","Emotional","Funny"],"lane":"For you","synopsis":"A novice musician joins an eccentric experimental band led by an enigmatic man in an oversized head.","why":"Its offbeat humour and sympathetic oddness neatly encapsulate what you value in unconventional cinema.","depth":"familiar"},{"id":"film-wild-tales","title":"Wild Tales","year":2014,"type":"film","genres":["Comedy","Thriller","Anthology"],"moods":["Dark","Funny","Gripping"],"lane":"For you","synopsis":"Six darkly comic stories show ordinary people reaching spectacular breaking points.","why":"Your enthusiasm for beautifully escalating bad behaviour makes this another foundational reference.","depth":"familiar"},{"id":"film-forrest-gump","title":"Forrest Gump","year":1994,"type":"film","genres":["Drama","Romance","Adventure"],"moods":["Emotional","Feel-good","Escape"],"lane":"Essential","synopsis":"A kindhearted man drifts through decades of American history while searching for connection.","why":"A favourite that proves heartfelt, accessible storytelling belongs alongside your art-house interests.","depth":"familiar"},{"id":"film-step-brothers","title":"Step Brothers","year":2008,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two immature grown men become unwilling housemates when their single parents marry.","why":"Your affection for unapologetically stupid comedy means serious recommendations must never crowd this out.","depth":"familiar"},{"id":"film-wedding-crashers","title":"Wedding Crashers","year":2005,"type":"film","genres":["Comedy","Romance"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two friends attend strangers' weddings to meet women until one falls into an inconvenient romance.","why":"A useful anchor for mainstream, high-energy, personality-led comedy.","depth":"familiar"},{"id":"film-the-hangover","title":"The Hangover","year":2009,"type":"film","genres":["Comedy","Mystery"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Friends wake from a Las Vegas bachelor party with no memory and a missing groom.","why":"You enjoy chaotic ensemble comedy where ridiculous events keep escalating.","depth":"familiar"},{"id":"film-the-truman-show","title":"The Truman Show","year":1998,"type":"film","genres":["Drama","Comedy","Sci-fi"],"moods":["Clever","Emotional"],"lane":"Essential","synopsis":"A genial insurance salesman starts suspecting his entire life is an elaborate television production.","why":"Jim Carrey, an inspired existential hook and real feeling make this especially central to your tastes.","depth":"familiar"},{"id":"film-the-mask","title":"The Mask","year":1994,"type":"film","genres":["Comedy","Fantasy"],"moods":["Funny","Easy","Weird"],"lane":"For you","synopsis":"A timid bank clerk transforms into a manic cartoon-like trickster whenever he wears a mysterious mask.","why":"Carrey's full-throttle physical comedy fits the flamboyantly absurd side of your viewing habits.","depth":"familiar"},{"id":"film-liar-liar","title":"Liar Liar","year":1997,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"A lawyer is magically forced to tell the truth for a day when he desperately needs to lie.","why":"A classic Carrey showcase of escalating farce and immaculate comic commitment.","depth":"familiar"},{"id":"film-bruce-almighty","title":"Bruce Almighty","year":2003,"type":"film","genres":["Comedy","Fantasy"],"moods":["Funny","Easy","Feel-good"],"lane":"For you","synopsis":"A frustrated television reporter is temporarily granted divine powers to prove he could run things better.","why":"A big-hearted high-concept comedy combining Jim Carrey's manic energy with an emotional finish.","depth":"familiar"},{"id":"film-man-on-the-moon","title":"Man on the Moon","year":1999,"type":"film","genres":["Comedy","Drama","Biography"],"moods":["Weird","Emotional"],"lane":"Essential","synopsis":"Jim Carrey portrays Andy Kaufman, a performer who challenged the boundaries between comedy and provocation.","why":"Its obsession with uncomfortable performance seems made for someone who loves both Carrey and I Think You Should Leave.","depth":"familiar"},{"id":"film-the-cable-guy","title":"The Cable Guy","year":1996,"type":"film","genres":["Comedy","Thriller"],"moods":["Dark","Funny","Weird"],"lane":"Wildcard","synopsis":"An awkward friendship with a cable installer turns into an increasingly unsettling obsession.","why":"Carrey's disturbing comic persona could appeal to your taste for uncomfortable humour.","depth":"deep"},{"id":"film-i-love-you-phillip-morris","title":"I Love You Phillip Morris","year":2009,"type":"film","genres":["Comedy","Drama","Romance"],"moods":["Funny","Emotional","Weird"],"lane":"For you","synopsis":"A charming con artist becomes determined to reunite with the man he loves through outrageous schemes.","why":"Carrey in a genuinely odd, tender and morally questionable story is a particularly promising combination.","depth":"familiar"},{"id":"film-dumb-and-dumber","title":"Dumb and Dumber","year":1994,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"Essential","synopsis":"Two spectacularly foolish friends take a cross-country trip to return a suitcase to its owner.","why":"A benchmark of broad comedy whose commitment to idiocy aligns with your Step Brothers affection.","depth":"familiar"},{"id":"film-the-big-lebowski","title":"The Big Lebowski","year":1998,"type":"film","genres":["Comedy","Crime","Mystery"],"moods":["Funny","Weird"],"lane":"Essential","synopsis":"A laid-back slacker is mistaken for a millionaire and pulled into an increasingly confusing kidnapping plot.","why":"Quotable eccentric characters and shaggy absurdity should suit your appetite for comic personality.","depth":"familiar"},{"id":"film-burn-after-reading","title":"Burn After Reading","year":2008,"type":"film","genres":["Comedy","Crime","Thriller"],"moods":["Dark","Funny"],"lane":"For you","synopsis":"A misplaced intelligence memoir collides with a set of vain, foolish Washington residents.","why":"Almost everyone behaves terribly and the plotting turns their incompetence into savage farce.","depth":"familiar"},{"id":"film-seven-psychopaths","title":"Seven Psychopaths","year":2012,"type":"film","genres":["Comedy","Crime"],"moods":["Dark","Funny","Weird"],"lane":"For you","synopsis":"A screenwriter and his volatile friends become entangled in the theft of a gangster's beloved dog.","why":"Martin McDonagh's dark jokes and spiralling mess make it a logical step from In Bruges.","depth":"familiar"},{"id":"film-the-banshees-of-inisherin","title":"The Banshees of Inisherin","year":2022,"type":"film","genres":["Comedy","Drama"],"moods":["Dark","Emotional","Atmospheric"],"lane":"For you","synopsis":"A friendship on a remote Irish island ends abruptly and escalates into stubborn mutual cruelty.","why":"A darker, more contemplative McDonagh film that tests your love for humour mixed with painful emotion.","depth":"familiar"},{"id":"film-the-death-of-stalin","title":"The Death of Stalin","year":2017,"type":"film","genres":["Comedy","History"],"moods":["Dark","Funny","Clever"],"lane":"For you","synopsis":"Soviet officials turn on one another after Stalin dies, scrambling for survival and power.","why":"The savage political farce and awful personalities should resonate after Succession and Sunny.","depth":"familiar"},{"id":"film-four-lions","title":"Four Lions","year":2010,"type":"film","genres":["Comedy","Drama"],"moods":["Dark","Funny"],"lane":"For you","synopsis":"A group of inept would-be terrorists stumble through increasingly disastrous plans.","why":"Very black British satire whose commitment to stupidity could match your taste for brutal comedy.","depth":"familiar"},{"id":"film-the-menu","title":"The Menu","year":2022,"type":"film","genres":["Comedy","Thriller","Horror"],"moods":["Dark","Gripping","Clever"],"lane":"For you","synopsis":"Guests at an exclusive island restaurant discover their tasting menu comes with sinister intentions.","why":"Controlled social satire, escalating menace and strong narrative hooks follow naturally from Parasite.","depth":"familiar"},{"id":"film-triangle-of-sadness","title":"Triangle of Sadness","year":2022,"type":"film","genres":["Comedy","Drama"],"moods":["Dark","Weird","Clever"],"lane":"For you","synopsis":"Models and billionaires aboard a luxury yacht find social hierarchies overturned by disaster.","why":"A vicious class satire that may appeal if Parasite's power games were what hooked you.","depth":"familiar"},{"id":"film-the-favourite","title":"The Favourite","year":2018,"type":"film","genres":["Comedy","Drama","History"],"moods":["Dark","Funny","Weird"],"lane":"Essential","synopsis":"Rival courtiers vie for influence over an ill queen in an extravagant royal household.","why":"Scheming, nastiness and sharply comic power struggles have clear Succession appeal.","depth":"familiar"},{"id":"film-poor-things","title":"Poor Things","year":2023,"type":"film","genres":["Comedy","Fantasy","Drama"],"moods":["Weird","Emotional","Clever"],"lane":"Wildcard","synopsis":"A revived young woman embarks on an uninhibited journey of discovery across an eccentric world.","why":"Bold visual originality and anarchic humour could delight you; its deliberate excess may be divisive.","depth":"deep"},{"id":"film-kinds-of-kindness","title":"Kinds of Kindness","year":2024,"type":"film","genres":["Drama","Comedy","Anthology"],"moods":["Weird","Dark"],"lane":"Wildcard","synopsis":"Three unsettling stories explore control, devotion and desperate attempts to remake relationships.","why":"A deliberately difficult, surreal experiment that tests how much uncomfortable oddness you want.","depth":"deep"},{"id":"film-the-grand-budapest-hotel","title":"The Grand Budapest Hotel","year":2014,"type":"film","genres":["Comedy","Adventure","Crime"],"moods":["Funny","Escape","Weird"],"lane":"Essential","synopsis":"A fastidious concierge and his lobby boy become embroiled in a stolen painting and an inheritance dispute.","why":"Its immaculate comic universe and eccentric personalities offer a very different flavour of distinctive filmmaking.","depth":"familiar"},{"id":"film-the-royal-tenenbaums","title":"The Royal Tenenbaums","year":2001,"type":"film","genres":["Comedy","Drama"],"moods":["Weird","Emotional","Funny"],"lane":"Essential","synopsis":"The estranged members of a once-promising family reconvene around their manipulative patriarch.","why":"Flawed people, precise humour and poignancy make it a strong character-led essential.","depth":"familiar"},{"id":"film-jojo-rabbit","title":"Jojo Rabbit","year":2019,"type":"film","genres":["Comedy","Drama","War"],"moods":["Funny","Emotional","Dark"],"lane":"For you","synopsis":"A lonely German boy in wartime confronts his prejudices with help from his imaginary friend.","why":"A risky balance of absurd humour and heartbreaking sentiment is right in your cross-genre sweet spot.","depth":"familiar"},{"id":"film-hunt-for-the-wilderpeople","title":"Hunt for the Wilderpeople","year":2016,"type":"film","genres":["Adventure","Comedy","Drama"],"moods":["Escape","Funny","Emotional"],"lane":"For you","synopsis":"A foster boy and his reluctant guardian become fugitives in the New Zealand wilderness.","why":"Adventure, lovable oddballs and earned feeling should appeal to the Walter Mitty side of you.","depth":"familiar"},{"id":"film-what-we-do-in-the-shadows","title":"What We Do in the Shadows","year":2014,"type":"film","genres":["Comedy","Horror"],"moods":["Funny","Weird"],"lane":"Wildcard","synopsis":"Flat-sharing vampires try to navigate modern life in a faux documentary of domestic disasters.","why":"You disliked the series, so this is a cautious curiosity rather than a strong match; the film's tighter format may differ.","depth":"deep"},{"id":"film-popstar-never-stop-never-stopping","title":"Popstar: Never Stop Never Stopping","year":2016,"type":"film","genres":["Comedy","Music"],"moods":["Funny","Easy","Weird"],"lane":"For you","synopsis":"A clueless pop megastar confronts career collapse and a spectacularly misjudged solo tour.","why":"Packed with deliberately stupid jokes and musical absurdity from the Hot Rod team.","depth":"familiar"},{"id":"film-walk-hard-the-dewey-cox-story","title":"Walk Hard: The Dewey Cox Story","year":2007,"type":"film","genres":["Comedy","Music"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"A fictional musical legend barrels through the clichés of a rock-and-roll biopic.","why":"Relentlessly silly parody with jokes coming from every direction rather than a complex plot.","depth":"familiar"},{"id":"film-macgruber","title":"MacGruber","year":2010,"type":"film","genres":["Comedy","Action"],"moods":["Funny","Easy","Weird"],"lane":"Wildcard","synopsis":"A disgraced special-operations agent returns for one disastrously incompetent mission.","why":"A divisive commitment-to-the-bit comedy that could play very well with your absurdist streak.","depth":"deep"},{"id":"film-game-night","title":"Game Night","year":2018,"type":"film","genres":["Comedy","Mystery"],"moods":["Funny","Gripping","Easy"],"lane":"For you","synopsis":"Friends hosting a murder-mystery party discover their carefully planned game is not what it seems.","why":"A genuinely funny mainstream comedy with an actual unfolding mystery and escalating errors.","depth":"familiar"},{"id":"film-21-jump-street","title":"21 Jump Street","year":2012,"type":"film","genres":["Comedy","Action"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two rookie officers pose as high-school students to infiltrate a drug ring.","why":"Fast, self-aware comedy whose stupid situations are backed by sharp joke-writing.","depth":"familiar"},{"id":"film-22-jump-street","title":"22 Jump Street","year":2014,"type":"film","genres":["Comedy","Action"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"The undercover partners return to education, this time to investigate suspicious activity at college.","why":"A very self-aware sequel that turns familiar comedy mechanics into running jokes.","depth":"familiar"},{"id":"film-the-other-guys","title":"The Other Guys","year":2010,"type":"film","genres":["Comedy","Action"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two overlooked police officers attempt to prove themselves on a financial-crime case.","why":"Will Ferrell chaos paired with a ridiculous buddy-cop plot should interest a Step Brothers fan.","depth":"familiar"},{"id":"film-talladega-nights-the-ballad-of-ric function filterDiscovery(){
 let q=ui.search.toLowerCase().trim();
 let matched=ALL().filter(p=>p.type===ui.type && (ui.genre==='All'||p.genres.includes(ui.genre)) && (ui.lane==='All'||p.lane===ui.lane) && (ui.mood==='Any'||p.moods.includes(ui.mood)) && routeFits(p,ui.route) && (ui.depth==='All'||(ui.depth==='deep'&&p.depth==='deep')||(ui.depth==='classic'&&p.year<1980)||(ui.depth==='recent'&&p.year>=2020)) && (!ui.hideSeen||unplayed(p)) && (ui.availability!=='included'||providerStatus(p).type==='included') && (!q||[p.title,p.year,p.synopsis,p.why,...p.genres,...p.moods].join(' ').toLowerCase().includes(q)));
 if(ui.sort==='newest') matched.sort((a,b)=>b.year-a.year);
 else if(ui.sort==='oldest') matched.sort((a,b)=>a.year-b.year);
 else if(ui.sort==='az') matched.sort((a,b)=>a.title.localeCompare(b.title));
 else if(ui.sort==='obscure') matched.sort((a,b)=>(b.depth==='deep'?1:0)-(a.depth==='deep'?1:0) || score(b)-score(a));

 return matched;
}

let affinityCache=null;
function learnedBoost(p){
 // Only genuine reactions shape this preference adjustment; simply watching something adds nothing.
 if(!affinityCache){let buckets={};for(let media of ALL()){let r=entry(media.id).rating,w={love:3,like:1,okay:0,dislike:-3}[r];if(w===undefined)continue;for(let tag of [...media.genres.map(x=>'g:'+x),...media.moods.map(x=>'m:'+x)]){let b=buckets[tag]||(buckets[tag]={sum:0,n:0});b.sum+=w;b.n++;}}affinityCache=buckets;}
 let total=0,used=0;for(let t of [...p.genres.slice(0,3).map(x=>'g:'+x),...p.moods.slice(0,2).map(x=>'m:'+x)]){let b=affinityCache[t];if(!b||b.n<2)continue;total+=b.sum/(b.n+3);used++;}return used?Math.max(-5,Math.min(8,total*3/used)):0;
}
function nuancedBoost(p){let boost=0,t=textOf(p),m=p.moods||[],g=p.genres||[];
 const contains=ws=>ws.some(w=>t.includes(w));
 if(contains(['dark comedy','black comedy','satir','bureaucr','institutional','social satire']))boost+=2.5;
 if(contains(['friendship','moving','emotional','tender','life-affirming','self-discovery'])&&(m.includes('Emotional')||m.includes('Feel-good')))boost+=2;
 if(g.includes('Sci-fi')||g.includes('Surreal')||g.includes('Fantasy')){if(contains(['mystery','identity','parallel','reality','conspiracy','secret','time','existential']))boost+=2;else boost-=1.5;}
 if((g.includes('Horror')||contains(['supernatural','haunted']))&&contains(['mystery','secret','family','psychological','dread']))boost+=2;
 if(p.type==='tv'&&contains(['quiz','panel show','reality','documentary','banter','comedians']))boost+=2;
 if(contains(['true crime','true-crime']))boost-=30;
 // Do not mistake historical reputation, absurdity alone or generic superhero action for a strong match.
 return boost;
}
function score(p,mood='Surprise me',energy='Medium',time='Any',who='Solo'){let e=entry(p.id);let score=(p.lane==='For you'?13:p.lane==='Essential'?8:4)+learnedBoost(p)+nuancedBoost(p);if(e.status==='want')score+=13;if(e.rating==='love')score+=3;let tags=p.moods||[];if(mood!=='Surprise me'){if(tags.includes(mood))score+=24;else score-=12;}if(energy==='Low'){if(tags.includes('Easy')||tags.includes('Funny')||tags.includes('Feel-good'))score+=8;if(tags.includes('Clever')&&!tags.includes('Funny'))score-=5;}else if(energy==='High'){if(tags.includes('Clever')||tags.includes('Atmospheric'))score+=6;}if(time==='Episode')score+=p.type==='tv'?12:-15;if(time==='Film')score+=p.type==='film'?12:-15;if(who==='Together'&&(tags.includes('Emotional')||tags.includes('Funny')))score+=2;score+=(hashInt(p.id)%101)/80;return score;}

function addCustom(f){let title=String(f.get('title')||'').trim(),typ=String(f.get('type'));if(!title)throw Error('Add a title first');let existing=ALL().find(p=>p.type===typ&&p.title.toLowerCase()===title.toLowerCase());if(existing){closeModal();openModal(existing.id);toast('Already in the collection');return}let year=Number(f.get('year'));let id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);let p={id,title,year,type:typ,genres:['Other'],moods:['Any'],lane:'For you',synopsis:String(f.get('synopsis')||'').trim()||'Your personal addition. Add a short synopsis when you have one.',why:String(f.get('why')||'').trim()||'You added this to track your viewing. Ask ChatGPT to write a personalised justification with your next update.',custom:true};db.custom.push(p);update(id,{status:'want'});closeModal();rerender();openModal(id);toast('Title added to your library')}
// Delegated controls allow content to be regenerated without losing event bindings.
document.addEventListener('click',ev=>{let quick=ev.target.closest('[data-action]');if(quick&&['quick-seen','quick-save','undo-records','toggle-bulk','bulk-seen','bulk-all','toggle-filters'].includes(quick.dataset.action)){handleAction(quick.dataset.action,quick);return}let n=ev.target.closest('[data-open]');if(n){openModal(n.dataset.open);return}let v=ev.target.closest('[data-view]');if(v){if(v.dataset.library)ui.libraryTab=v.dataset.library;goto(v.dataset.view);return}let action=ev.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}let kd=ev.target.closest('[data-kind]');if(kd){ui.type=kd.dataset.kind;ui.genre='All';ui.limit=36;rerender();return}let route=ev.target.closest('[data-route]');if(route){ui.route=route.dataset.route;ui.genre='All';ui.mood='Any';ui.limit=36;rerender();return}let df=ev.target.closest('[data-depth]');if(df){ui.depth=df.dataset.depth;ui.limit=36;rerender();return}let mood=ev.target.closest('[data-mood]');if(mood){setMood(mood.dataset.mood);return}let lm=ev.target.closest('[data-library]');if(lm){ui.libraryTab=lm.dataset.library;goto('library');return}let tm=ev.target.closest('[data-tonight-mood]');if(tm){ui.tonightMood=tm.dataset.tonightMood;ui.pickRound=0;ui.pickExclude=[];rerender();return}let pro=ev.target.closest('[data-provider]');if(pro){let v=pro.dataset.provider;db.providers=db.providers.includes(v)?db.providers.filter(x=>x!==v):[...db.providers,v];persist();rerender();return}let col=ev.target.closest('[data-collection]');if(col){ui.mood=col.dataset.collection;ui.genre='All';ui.lane='All';ui.depth='All';ui.limit=36;goto('discover');return}if(ev.target.dataset.shade==='true'){closeModal();return}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='genreFilter'){ui.genre=t.value;ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='laneFilter'){ui.lane=t.value;ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='sortFilter'){ui.sort=t.value;ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='pickerEnergy'){ui.energy=t.value;rerender()}if(t.id==='pickerTime'){ui.time=t.value;rerender()}if(t.id==='pickerWho'){ui.who=t.value;rerender()}if(t.dataset.bulkId){if(t.checked)ui.bulkIds.add(t.dataset.bulkId);else ui.bulkIds.delete(t.dataset.bulkId);document.querySelector('.bulk-toolbar strong')?.replaceChildren(document.createTextNode(ui.bulkIds.size+' selected'));let btn=document.querySelector('[data-action=bulk-seen]');if(btn)btn.disabled=!ui.bulkIds.size;}if(t.id==='includedOnly'){ui.availability=t.checked?'included':'all';ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults();}if(t.id==='hideSeen'){ui.hideSeen=t.checked;ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='entryStatus'){update(t.dataset.id,{status:t.value});refreshModal();toast('Status saved')}if(t.id==='entryRating'){update(t.dataset.id,{rating:t.value});refreshModal();toast('Rating saved')}if(t.id==='entryReason'){update(t.dataset.id,{reason:t.value});toast('Reason saved')}});
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='searchInput'){ui.search=t.value;ui.limit=36;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='entryNote')update(t.dataset.id,{note:t.value});if(t.id==='entryProgress')update(t.dataset.id,{progress:t.value});if(t.id==='tasteNotes'){db.tasteNotes=t.value;persist()}if(t.id==='customSynopsis'||t.id==='customWhy'){let p=db.custom.find(x=>x.id===t.dataset.id);if(p){p[t.id==='customSynopsis'?'synopsis':'why']=t.value;persist()}}if(t.id==='globalSearch'){document.querySelector('#globalResults').innerHTML=globalResults(t.value)}});
document.addEventListener('submit',ev=>{if(ev.target.id==='customForm'){ev.preventDefault();try{addCustom(new FormData(ev.target))}catch(x){toast(x.message)}}});
document.querySelector('#importFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{if(file.size>10_000_000)throw Error('File too large for a personal backup');let obj=JSON.parse(await file.text());let count=ingest(obj);closeModal();toast(`Imported ${count} personal records`)}catch(e){toast('Import failed: '+e.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card-art')){e.preventDefault();openModal(e.target.dataset.open)}});
window.addEventListener('hashchange',()=>{let route=location.hash.replace('#','');if(['home','discover','library','taste','tonight'].includes(route)&&ui.view!==route){ui.view=route;rerender()}});
let init=location.hash.replace('#','');if(['home','discover','library','taste','tonight'].includes(init))ui.view=init;else history.replaceState(null,'','#home');
rerender();persist();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.__THE_CUT_TEST__={catalogue:CATALOGUE,db,score,markdown:exportMarkdown,currentExport,filterDiscovery,ui,getRecord:entry};
})();
