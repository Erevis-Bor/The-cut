<script>
/* Hand-curated offline catalogue. Each title includes a synopsis and a reason tailored to your viewing profile. */
window.CUT_CATALOGUE = [{"id":"film-adaptation","title":"Adaptation.","year":2002,"type":"film","genres":["Comedy","Drama","Surreal"],"moods":["Clever","Funny"],"lane":"For you","synopsis":"A blocked screenwriter struggles to adapt a book and becomes entangled in his own screenplay.","why":"Kaufman's self-referential weirdness could land between the invention of Eternal Sunshine and the chaos of Frank."},{"id":"film-palm-springs","title":"Palm Springs","year":2020,"type":"film","genres":["Comedy","Romance","Sci-fi"],"moods":["Funny","Feel-good","Clever"],"lane":"For you","synopsis":"Two wedding guests become trapped reliving the same day, with increasingly complicated feelings.","why":"A genuinely funny high-concept romance: absurdity, commitment and surprising tenderness in one tidy film."},{"id":"film-hot-rod","title":"Hot Rod","year":2007,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"An inept would-be stuntman attempts a spectacular jump to raise money for his stepfather.","why":"Its gleeful stupidity and commitment to bizarre bits could hit your Step Brothers and I Think You Should Leave sweet spot."},{"id":"film-the-nice-guys","title":"The Nice Guys","year":2016,"type":"film","genres":["Comedy","Crime","Mystery"],"moods":["Funny","Gripping"],"lane":"For you","synopsis":"A hapless private investigator and a bruiser investigate a missing woman in 1970s Los Angeles.","why":"Idiotic men, terrific comic timing and an actual mystery: the balance you say matters."},{"id":"film-arrival","title":"Arrival","year":2016,"type":"film","genres":["Sci-fi","Drama","Mystery"],"moods":["Clever","Emotional","Atmospheric"],"lane":"Essential","synopsis":"A linguist joins an effort to communicate with mysterious spacecraft that have appeared worldwide.","why":"An emotionally potent puzzle-box story with intelligence and restraint, especially promising after Severance and Eternal Sunshine."},{"id":"film-swiss-army-man","title":"Swiss Army Man","year":2016,"type":"film","genres":["Comedy","Drama","Surreal"],"moods":["Weird","Emotional"],"lane":"Wildcard","synopsis":"A stranded man befriends a corpse whose impossible abilities lead them on an unlikely journey.","why":"Its deeply odd mix of vulnerability and absurdity makes it an adventurous next step after Frank."},{"id":"film-little-miss-sunshine","title":"Little Miss Sunshine","year":2006,"type":"film","genres":["Comedy","Drama"],"moods":["Funny","Emotional","Feel-good"],"lane":"For you","synopsis":"An eccentric family drives a failing van across America for their daughter's beauty pageant.","why":"You respond to messy people, sharp laughs and earned warmth; this combines all three."},{"id":"film-being-john-malkovich","title":"Being John Malkovich","year":1999,"type":"film","genres":["Surreal","Comedy","Drama"],"moods":["Weird","Clever"],"lane":"Essential","synopsis":"A puppeteer discovers a portal allowing visitors to inhabit an actor's mind for fifteen minutes.","why":"Your positive rating confirms a taste for bold identity-bending premises, even without an emotional home run."},{"id":"film-everything-everywhere-all-at-once","title":"Everything Everywhere All at Once","year":2022,"type":"film","genres":["Sci-fi","Comedy","Adventure"],"moods":["Weird","Emotional","Clever"],"lane":"Essential","synopsis":"A struggling laundromat owner is swept into a multiverse crisis involving alternate versions of her life.","why":"A confirmed favourite: huge imagination, ferocious silliness and a moving emotional core."},{"id":"film-the-lobster","title":"The Lobster","year":2015,"type":"film","genres":["Surreal","Comedy","Romance"],"moods":["Weird","Dark","Clever"],"lane":"Wildcard","synopsis":"Single adults at a remote hotel face an absurd deadline to find love or become animals.","why":"Your liking for its discomfort suggests risk-taking is welcome, though cold surrealism alone isn't enough."},{"id":"film-her","title":"Her","year":2013,"type":"film","genres":["Sci-fi","Romance","Drama"],"moods":["Emotional","Clever","Atmospheric"],"lane":"For you","synopsis":"A lonely writer develops a relationship with a sophisticated artificial intelligence voice.","why":"Your positive response points to thoughtful technology stories grounded in human longing."},{"id":"film-in-bruges","title":"In Bruges","year":2008,"type":"film","genres":["Comedy","Crime","Drama"],"moods":["Dark","Funny","Emotional"],"lane":"For you","synopsis":"Two hitmen hide in a Belgian town as guilt, boredom and a botched job catch up with them.","why":"A confirmed favourite and almost a template for your taste in savage humour with unexpected heart."},{"id":"film-parasite","title":"Parasite","year":2019,"type":"film","genres":["Thriller","Comedy","Drama"],"moods":["Dark","Gripping","Clever"],"lane":"Essential","synopsis":"An impoverished family infiltrates a wealthy household through increasingly elaborate deceptions.","why":"Your love for its razor-sharp storytelling confirms social satire and suspense make a powerful combination."},{"id":"film-the-secret-life-of-walter-mitty","title":"The Secret Life of Walter Mitty","year":2013,"type":"film","genres":["Adventure","Comedy","Drama"],"moods":["Feel-good","Emotional","Escape"],"lane":"For you","synopsis":"A daydreaming photo editor finally ventures into the world to find a missing photograph.","why":"Your love of its wonder and movement is a crucial counterweight to the darker side of your taste."},{"id":"film-get-out","title":"Get Out","year":2017,"type":"film","genres":["Horror","Mystery","Thriller"],"moods":["Dark","Gripping","Clever"],"lane":"Essential","synopsis":"A young man visits his girlfriend's family and uncovers disturbing secrets behind their hospitality.","why":"You liked its socially charged mystery; a good sign for idea-driven horror with real narrative payoff."},{"id":"film-whiplash","title":"Whiplash","year":2014,"type":"film","genres":["Drama","Music"],"moods":["Gripping","Dark"],"lane":"Essential","synopsis":"An ambitious young drummer enters a brutal contest of wills with his demanding teacher.","why":"Your positive rating supports intense character battles, although intensity itself doesn't guarantee love."},{"id":"film-eternal-sunshine-of-the-spotless-mind","title":"Eternal Sunshine of the Spotless Mind","year":2004,"type":"film","genres":["Romance","Sci-fi","Drama"],"moods":["Emotional","Weird","Clever"],"lane":"For you","synopsis":"Former lovers undergo a procedure to erase each other, only for memories to resist oblivion.","why":"One of your favourites and a key anchor for strange premises with an enormous emotional payoff."},{"id":"film-into-the-wild","title":"Into the Wild","year":2007,"type":"film","genres":["Adventure","Drama"],"moods":["Escape","Emotional","Atmospheric"],"lane":"For you","synopsis":"A young graduate abandons convention to travel across America and live on his own terms.","why":"Your affection for searching, aspirational journeys makes this a defining part of your profile."},{"id":"film-frank","title":"Frank","year":2014,"type":"film","genres":["Comedy","Drama","Music"],"moods":["Weird","Emotional","Funny"],"lane":"For you","synopsis":"A novice musician joins an eccentric experimental band led by an enigmatic man in an oversized head.","why":"Its offbeat humour and sympathetic oddness neatly encapsulate what you value in unconventional cinema."},{"id":"film-wild-tales","title":"Wild Tales","year":2014,"type":"film","genres":["Comedy","Thriller","Anthology"],"moods":["Dark","Funny","Gripping"],"lane":"For you","synopsis":"Six darkly comic stories show ordinary people reaching spectacular breaking points.","why":"Your enthusiasm for beautifully escalating bad behaviour makes this another foundational reference."},{"id":"film-forrest-gump","title":"Forrest Gump","year":1994,"type":"film","genres":["Drama","Romance","Adventure"],"moods":["Emotional","Feel-good","Escape"],"lane":"Essential","synopsis":"A kindhearted man drifts through decades of American history while searching for connection.","why":"A favourite that proves heartfelt, accessible storytelling belongs alongside your art-house interests."},{"id":"film-step-brothers","title":"Step Brothers","year":2008,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two immature grown men become unwilling housemates when their single parents marry.","why":"Your affection for unapologetically stupid comedy means serious recommendations must never crowd this out."},{"id":"film-wedding-crashers","title":"Wedding Crashers","year":2005,"type":"film","genres":["Comedy","Romance"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Two friends attend strangers' weddings to meet women until one falls into an inconvenient romance.","why":"A useful anchor for mainstream, high-energy, personality-led comedy."},{"id":"film-the-hangover","title":"The Hangover","year":2009,"type":"film","genres":["Comedy","Mystery"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"Friends wake from a Las Vegas bachelor party with no memory and a missing groom.","why":"You enjoy chaotic ensemble comedy where ridiculous events keep escalating."},{"id":"film-the-truman-show","title":"The Truman Show","year":1998,"type":"film","genres":["Drama","Comedy","Sci-fi"],"moods":["Clever","Emotional"],"lane":"Essential","synopsis":"A genial insurance salesman starts suspecting his entire life is an elaborate television production.","why":"Jim Carrey, an inspired existential hook and real feeling make this especially central to your tastes."},{"id":"film-the-mask","title":"The Mask","year":1994,"type":"film","genres":["Comedy","Fantasy"],"moods":["Funny","Easy","Weird"],"lane":"For you","synopsis":"A timid bank clerk transforms into a manic cartoon-like trickster whenever he wears a mysterious mask.","why":"Carrey's full-throttle physical comedy fits the flamboyantly absurd side of your viewing habits."},{"id":"film-liar-liar","title":"Liar Liar","year":1997,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"For you","synopsis":"A lawyer is magically forced to tell the truth for a day when he desperately needs to lie.","why":"A classic Carrey showcase of escalating farce and immaculate comic commitment."},{"id":"film-bruce-almighty","title":"Bruce Almighty","year":2003,"type":"film","genres":["Comedy","Fantasy"],"moods":["Funny","Easy","Feel-good"],"lane":"For you","synopsis":"A frustrated television reporter is temporarily granted divine powers to prove he could run things better.","why":"A big-hearted high-concept comedy combining Jim Carrey's manic energy with an emotional finish."},{"id":"film-man-on-the-moon","title":"Man on the Moon","year":1999,"type":"film","genres":["Comedy","Drama","Biography"],"moods":["Weird","Emotional"],"lane":"Essential","synopsis":"Jim Carrey portrays Andy Kaufman, a performer who challenged the boundaries between comedy and provocation.","why":"Its obsession with uncomfortable performance seems made for someone who loves both Carrey and I Think You Should Leave."},{"id":"film-the-cable-guy","title":"The Cable Guy","year":1996,"type":"film","genres":["Comedy","Thriller"],"moods":["Dark","Funny","Weird"],"lane":"Wildcard","synopsis":"An awkward friendship with a cable installer turns into an increasingly unsettling obsession.","why":"Carrey's disturbing comic persona could appeal to your taste for uncomfortable humour."},{"id":"film-i-love-you-phillip-morris","title":"I Love You Phillip Morris","year":2009,"type":"film","genres":["Comedy","Drama","Romance"],"moods":["Funny","Emotional","Weird"],"lane":"For you","synopsis":"A charming con artist becomes determined to reunite with the man he loves through outrageous schemes.","why":"Carrey in a genuinely odd, tender and morally questionable story is a particularly promising combination."},{"id":"film-dumb-and-dumber","title":"Dumb and Dumber","year":1994,"type":"film","genres":["Comedy"],"moods":["Funny","Easy"],"lane":"Essential","synopsis":"Two spectacularly foolish friends take a cross-country trip to return a suitcase to its owner.","why":"A benchmark of broad comedy whose commitment to idiocy aligns with your Step Brothers affection."},{"id":"film-the-big-lebowski","title":"The Big Lebowski","year":1998,"type":"film","genres":["Comedy","Crime","Mystery"],"moods":["Funny","Weird"],"lane":"Essential","synopsis":"A laid-back slacker is mistaken for a millionaire and pulled into an increasingly confusing kidnapping plot.","why":"Quotable eccentric characters and shaggy absurdity should suit your appetite for comic personality."},{"id":"film-burn-after-reading","title":"Burn After Reading","year":2008,"type":"film","genres":["Comedy","Crime","Thriller"],"moods":["Dark","Funny"],"lane":"For you","synopsis":"A misplaced intelligence memoir collides with a set of vain, foolish Washington residents.","why":"Almost everyone behaves terribly and the plotting turns their incompetence into savage farce."},{"id":"film-seven-psychopaths","title":"Seven Psychopaths","year":2012,"type":"film","genres":["Comedy","Crime"],"moods":["Dark","Funny","Weird"],"lane":"For you","synopsis":"A screenwriter and his volatile friends become entangled in the theft of a gangster's beloved dog.","why":"Martin McDonagh's dark jokes and spiralling mess make it a logical step from In Bruges."},{"id":"film-the-banshees-of-inisherin","title":"The Banshees of Inisherin","year":2022,"type":"film","genres":["Comedy","Drama"],"moods":["Dark","Emotional","Atmospheric"],"lane":"For you","synopsis":"A friendship on a remote Irish island ends abruptly and escalates into stubborn mutual cruelty.","why":"A darker, more contemplative McDonagh film that tests your love for humour mixed with painful emotion."},{"id":"film-the-death-of-stalin","title":"The Death of Stalin","year":2017,"type":"film","genres":["Comedy","History"],"moods":["Dark","Funny","Clever"],"lane":"For you","synopsis":"Soviet officials turn on one anot <div class="stat-strip"><div class="stat"><strong>${ALL().length}</strong><span>Considered titles</span></div><div class="stat"><strong>${statCount('watched')+statCount('seen')}</strong><span>Seen / finished</span></div><div class="stat"><strong>${statCount('want')}</strong><span>On your shortlist</span></div><div class="stat"><strong>${favouriteCount()}</strong><span>Personal favourites</span></div></div>

function discoverResults(){let q=ui.search.toLowerCase().trim();let matched=ALL().filter(p=>p.type===ui.type&&(ui.genre==='All'||p.genres.includes(ui.genre))&&(ui.lane==='All'||p.lane===ui.lane)&&(ui.mood==='Any'||p.moods.includes(ui.mood))&&(!q||[p.title,p.year,p.synopsis,p.why,...p.genres,...p.moods].join(' ').toLowerCase().includes(q)) );if(ui.sort==='newest')matched.sort((a,b)=>b.year-a.year);else if(ui.sort==='oldest')matched.sort((a,b)=>a.year-b.year);else if(ui.sort==='az')matched.sort((a,b)=>a.title.localeCompare(b.title));else matched.sort((a,b)=>score(b,'Surprise me','Medium','Any','Solo')-score(a,'Surprise me','Medium','Any','Solo'));return `<div class="results-line"><span><strong>${matched.length}</strong> titles · Each one has a personal justification</span><button class="inline-link" data-action="reset-filters">Reset filters ↻</button></div>${listCards(matched)}`}

function library(){let tabs=[['all','All tracked'],['want','Watchlist'],['watched','Finished'],['seen','Seen'],['sampled','Sampled'],['paused','Paused'],['watching','Watching'],['dropped','Dropped'],['not-continuing','Not continuing'],['love','Loved'],['not-interested','Not interested']];let choices=ALL().filter(p=>{let e=entry(p.id);return ui.libraryTab==='all'?e.status!=='none'||e.rating!=='none':ui.libraryTab==='love'?e.rating==='love':e.status===ui.libraryTab});choices.sort((a,b)=>{let ae=entry(a.id),be=entry(b.id);return (be.updated||'').localeCompare(ae.updated||'') || a.title.localeCompare(b.title)});
return `${header('Your library.','Your choices, your history. Starting something is not the same as finishing it.',`<div class="hero-buttons">${button('open-add','+ Add title','subtle')}${button('open-export','↗ Export data','ghost')}</div>`)}<div class="stat-strip"><div class="stat"><strong>${statCount('want')}</strong><span>Want to watch</span></div><div class="stat"><strong>${statCount('watched')+statCount('seen')}</strong><span>Seen / watched</span></div><div class="stat"><strong>${statCount('paused')+statCount('watching')}</strong><span>In progress / paused</span></div><div class="stat"><strong>${ratedCount()}</strong><span>Rated</span></div></div><div class="library-summary">${tabs.map(([id,label])=>`<button data-library="${id}" class="${ui.libraryTab===id?'active':''}">${label}<b>${id==='all'?ALL().filter(p=>entry(p.id).status!=='none'||entry(p.id).rating!=='none').length:id==='love'?favouriteCount():statCount(id)}</b></button>`).join('')}</div>${choices.length?listCards(choices):`<div class="empty"><strong>Nothing in this section yet.</strong><span>Explore the catalogue, open a title and set its status. Your ratings and notes stay attached to it.</span>${button('go-discover','Explore titles','subtle')}</div>`}`}
function taste(){let all=ALL();let ratings={love:0,like:0,okay:0,dislike:0};all.forEach(p=>{let r=entry(p.id).rating;if(ratings[r]!=null)ratings[r]++});let most=[[...new Set(CATALOGUE.flatMap(p=>p.genres))].map(g=>({name:g,n:all.filter(p=>entry(p.id).rating==='love'&&p.genres.includes(g)).length}))][0].sort((a,b)=>b.n-a.n).filter(x=>x.n>0).slice(0,7);let max=Math.max(1,...most.map(x=>x.n));return `${header('A taste of your own.','A growing portrait of what you enjoy, built from your actual reactions rather than genre assumptions.',button('open-export','↗ Export your profile','subtle'))}<div class="stat-strip"><div class="stat"><strong>${ratedCount()}</strong><span>Things rated</span></div><div class="stat"><strong>${ratings.love}</strong><span>Absolutely loved</span></div><div class="stat"><strong>${ratings.like}</strong><span>Liked</span></div><div class="stat"><strong>${ratings.dislike}</strong><span>Disliked</span></div></div><div class="section-top"><div><div class="eyebrow">WHAT WE'VE LEARNED SO FAR</div><h2>Your viewing DNA</h2></div></div><div class="split"><div class="panel"><div class="eyebrow">THE DISCERNING ECLECTIC</div><p class="profile-quote">“Bold ideas. Brilliant jokes. Compelling stories. And something worth feeling.”</p><p class="micro">You've loved everything from bleak satire to deeply warm comedy, unusual romance, and expansive science fiction. The common thread is excellent execution: a narrative that earns its intrigue, humour that actually lands, characters worth spending time with and emotional impact that feels real.</p><div class="metric-box"><div class="metric-line"><strong>High-signal matches</strong><p>Inventive premises with payoff · dark satire · compelling fictional mysteries · flawed characters · emotionally resonant adventure</p></div><div class="metric-line"><strong>Things to avoid</strong><p>True crime · generic workplace comedy · spectacle without story · mysteries that go nowhere · humour that doesn't land</p></div><div class="metric-line"><strong>Biggest variable</strong><p>Your mood tonight. Complexity, warmth, horror and how hard you want to concentrate can all change.</p></div></div></div><div class="panel"><h3>Genres among your favourites</h3><p class="micro">How often each tag appears on titles you've marked as loved. Overlapping genres are counted separately.</p>${most.map(g=>`<div class="bar-row"><span>${safe(g.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(g.n/max*100)}%"></div></div><strong>${g.n}</strong></div>`).join('')}<div class="divider"></div><h3>Rating breakdown</h3>${Object.keys(ratings).map(r=>`<div class="list-row"><span class="dot"></span><div class="grow"><strong>${RATING_LABEL[r]}</strong></div><strong>${ratings[r]}</strong></div>`).join('')}</div></div><div class="section-top"><div><div class="eyebrow">HELP FUTURE RECOMMENDATIONS</div><h2>Anything else I should know?</h2><p>Add a note about your evolving tastes. It's included in both types of export.</p></div></div><div class="panel"><textarea id="tasteNotes" class="comment" style="min-height:120px" placeholder="e.g. I tried X and it was too slow. I'm getting into animation. Bethan and I both loved Y…">${safe(db.tasteNotes)}</textarea><div class="edit-params"><span class="notice">Autosaved on this device.</span>${button('open-export','Export for ChatGPT ↗','subtle')}</div></div><div class="section-top"><div><div class="eyebrow">YOUR STREAMING SERVICES</div><h2>Where you subscribe</h2><p>These are included in your ChatGPT update; the app does not claim live availability.</p></div></div><div class="panel"><div class="pills">${PROVIDERS.map(s=>`<button data-provider="${safe(s)}" class="pill ${db.providers.includes(s)?'active':''}">${db.providers.includes(s)?'✓ ':''}${safe(s)}</button>`).join('')}</div><p class="privacy-notice" style="margin:12px 0 0">Tap to select or remove a service. For actual offers, use each title's JustWatch UK link.</p></div>`}
let affinityCache=null;
function learnedBoost(p){
 // Only genuine reactions shape this preference adjustment; simply watching something adds nothing.
 if(!affinityCache){let buckets={};for(let media of ALL()){let r=entry(media.id).rating,w={love:3,like:1,okay:0,dislike:-3}[r];if(w===undefined)continue;for(let tag of [...media.genres.map(x=>'g:'+x),...media.moods.map(x=>'m:'+x)]){let b=buckets[tag]||(buckets[tag]={sum:0,n:0});b.sum+=w;b.n++;}}affinityCache=buckets;}
 let total=0,used=0;for(let t of [...p.genres.slice(0,3).map(x=>'g:'+x),...p.moods.slice(0,2).map(x=>'m:'+x)]){let b=affinityCache[t];if(!b||b.n<2)continue;total+=b.sum/(b.n+3);used++;}return used?Math.max(-5,Math.min(8,total*3/used)):0;
}
function score(p,mood='Surprise me',energy='Medium',time='Any',who='Solo'){let e=entry(p.id);let score=(p.lane==='For you'?13:p.lane==='Essential'?8:4)+learnedBoost(p);if(e.status==='want')score+=13;if(e.rating==='love')score+=3;let tags=p.moods||[];if(mood!=='Surprise me'){if(tags.includes(mood))score+=24;else score-=12;}if(energy==='Low'){if(tags.includes('Easy')||tags.includes('Funny')||tags.includes('Feel-good'))score+=8;if(tags.includes('Clever')&&!tags.includes('Funny'))score-=5;}else if(energy==='High'){if(tags.includes('Clever')||tags.includes('Atmospheric'))score+=6;}if(time==='Episode')score+=p.type==='tv'?12:-15;if(time==='Film')score+=p.type==='film'?12:-15;if(who==='Together'&&(tags.includes('Emotional')||tags.includes('Funny')))score+=2;score+=(hashInt(p.id)%101)/80;return score;}
function picks(){let opts=ALL().filter(unplayed).filter(p=>!ui.pickExclude.includes(p.id));let result=opts.map(p=>({p,score:score(p,ui.tonightMood,ui.energy,ui.time,ui.who)+(hashInt(p.id+'round'+ui.pickRound)%137)/16})).sort((a,b)=>b.score-a.score).map(x=>x.p);let picks=[];for(let p of result){if(picks.length>=3)break;if(picks.some(x=>x.genres[0]===p.genres[0]&&x.type===p.type))continue;picks.push(p)}for(let p of result){if(picks.length>=3)break;if(!picks.includes(p))picks.push(p)}return picks;}
function tonight(){let chosen=picks();return `${header('Tonight, sorted.','One good choice beats forty minutes of scrolling. These picks use your mood as a filter on top of your actual taste.')}<div class="tonight-wizard"><div class="eyebrow">01 / YOUR MOOD</div><div class="pills" style="margin-top:12px">${[['Surprise me','Surprise me'],['Funny','Make me laugh'],['Emotional','Feel something'],['Clever','Blow my mind'],['Atmospheric','Get unsettled'],['Escape','Take me away'],['Gripping','Hook me in']].map(([value,label])=>`<button class="pill ${ui.tonightMood===value?'active':''}" data-tonight-mood="${value}">${label}</button>`).join('')}</div><div class="picker-row"><div><label class="form-label" for="pickerEnergy">Brainpower tonight</label><select class="select" id="pickerEnergy"><option value="Low" ${ui.energy==='Low'?'selected':''}>Very little, thanks</option><option value="Medium" ${ui.energy==='Medium'?'selected':''}>A reasonable amount</option><option value="High" ${ui.energy==='High'?'selected':''}>Give me a challenge</option></select></div><div><label class="form-label" for="pickerTime">Commitment</label><select class="select" id="pickerTime"><option value="Any" ${ui.time==='Any'?'selected':''}>Either format</option><option value="Episode" ${ui.time==='Episode'?'selected':''}>An episode</option><option value="Film" ${ui.time==='Film'?'selected':''}>A whole film</option></select></div><div><label class="form-label" for="pickerWho">With</label><select class="select" id="pickerWho"><option value="Solo" ${ui.who==='Solo'?'selected':''}>Just me</option><option value="Together" ${ui.who==='Together'?'selected':''}>Bethan</option></select></div></div><div class="edit-params"><button class="btn subtle tiny" data-action="reroll">↻ Show different picks</button><span class="notice">No guessed runtimes or unverified streaming claims.</span></div></div><div class="section-top"><div><div class="eyebrow">YOUR THREE PICKS</div><h2>${ui.tonightMood==='Surprise me'?'Something to suit you':'The '+ui.tonightMood.toLowerCase()+' edition'}</h2><p>Open each card to see the full plot, why it fits, and check where it's streaming.</p></div></div>${listCards(chosen,'pick-results')}<div class="section-top"><div><div class="eyebrow">NOT JUST THE SAME OLD STUFF</div><h2>Broaden your horizons</h2><p>Thoughtful wildcards beyond the obvious favourites.</p></div></div>${listCards(CATALOGUE.filter(p=>p.lane==='Wildcard'&&unplayed(p)).sort((a,b)=>hashInt(a.id+'wild'+ui.pickRound)-hashInt(b.id+'wild'+ui.pickRound)).slice(0,6),'shelf-scroller')}`}
function detail(p){let e=entry(p.id),[a,b]=palette(p),custom=Boolean(p.custom);return `<div class="modal-shade" data-shade="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${safe(p.title)} details"><button class="modal-close" data-action="close-modal" aria-label="Close details">×</button><div class="modal-banner" style="background:radial-gradient(ellipse at 75% 34%,${a}b3,transparent 50%),linear-gradient(125deg,${a},${b})"><div><div class="eyebrow">${p.type==='film'?'FILM':'TELEVISION'} / ${p.year} / ${safe(p.lane)}</div><h2>${safe(p.title)}</h2></div></div><div class="modal-inner"><div class="description-pair"><div><h4>The story</h4><p>${safe(p.synopsis)}</p></div><div><h4>${custom?'Why it is in your library':'Why I chose it for you'}</h4><p>${safe(p.why)}</p></div></div><div class="modal-genre">${p.genres.map(g=>`<span class="mini-tag">${safe(g)}</span>`).join('')}${p.moods.map(m=>`<span class="mini-tag">${safe(m)}</span>`).join('')}</div><div class="divider"></div><div class="eyebrow">YOUR PRIVATE RECORD</div><div class="edit-grid"><div><label class="form-label" for="entryStatus">Viewing status</label><select class="select" id="entryStatus" data-id="${safe(p.id)}">${STATUS.map(s=>`<option value="${s}" ${e.status===s?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div><div><label class="form-label" for="entryRating">What did you think?</label><select class="select" id="entryRating" data-id="${safe(p.id)}">${RATING.map(r=>`<option value="${r}" ${e.rating===r?'selected':''}>${RATING_LABEL[r]}</option>`).join('')}</select></div></div>${custom?`<div class="divider"></div><div class="eyebrow">EDIT YOUR ADDED TITLE</div><label class="form-label" for="customSynopsis">Short synopsis</label><textarea id="customSynopsis" data-id="${safe(p.id)}" class="comment" style="min-height:70px">${safe(p.synopsis)}</textarea><label class="form-label" for="customWhy">Why it's in your collection</label><textarea id="customWhy" data-id="${safe(p.id)}" class="comment" style="min-height:70px">${safe(p.why)}</textarea><p class="privacy-notice">These manual notes are yours; a future ChatGPT update can supply a tailored editorial justification.</p><div class="divider"></div>`:''}${p.type==='tv'?`<label class="form-label" for="entryProgress">Season / episode progress</label><input class="field" id="entryProgress" data-id="${safe(p.id)}" maxlength="120" value="${safe(e.progress||'')}" placeholder="e.g. Season 2, episode 4 — or season 1 finished">`:''}<label class="form-label" for="entryReason">If you stopped watching, what was the main reason?</label><select class="select" id="entryReason" data-id="${safe(p.id)}">${['','Not funny enough','Story not engaging','Pacing too slow','Characters did not connect','Not in the mood','Too disturbing','Stopped for practical reasons','Finished what interested me','Other / see comment'].map(s=>`<option value="${safe(s)}" ${e.reason===s?'selected':''}>${safe(s||'No reason selected')}</option>`).join('')}</select><label class="form-label" for="entryNote">Your comment / context</label><textarea class="comment" id="entryNote" data-id="${safe(p.id)}" maxlength="10000" placeholder="What did you love or dislike? Why did you stop? What should future recommendations learn from this?">${safe(e.note||'')}</textarea><div class="edit-params"><span class="notice">Your changes and comment are saved automatically.</span><button class="btn tiny ghost" data-action="add-to-watchlist" data-id="${safe(p.id)}">${e.status==='want'?'✓ On watchlist':'+ Watchlist'}</button></div><div class="divider"></div><div class="modal-actions"><a class="btn subtle" target="_blank" rel="noopener noreferrer" href="https://www.justwatch.com/uk/search?q=${encodeURIComponent(p.title)}">Where to watch in the UK ↗</a><button class="btn ghost" data-action="open-export">Export my data ↗</button></div><p class="privacy-notice" style="margin-bottom:0">Opens a JustWatch search. Check provider and whether it's included in your subscription; the app doesn't claim live availability.</p></div></section></div>`}
function exportModal(){return `<div class="modal-shade" data-shade="true"><section class="modal" role="dialog" aria-modal="true" aria-label="Export and backup"><button class="modal-close" data-action="close-modal">×</button><div class="modal-inner" style="padding-top:38px"><div class="eyebrow">OWN YOUR DATA</div><h2 style="font-size:32px;letter-spacing:-1px;margin:9px 0 8px">Your taste. Your data.</h2><p class="lead">Export every rating, viewing status, episode progress and comment. Bring it back to ChatGPT so recommendations can keep getting better.</p><div class="tip"><strong>Best for ChatGPT:</strong> Download or copy your update. It contains all titles you've interacted with, comments, statuses and your 15-item shortlist. Upload it or paste it into our conversation.</div><div class="export-buttons" style="margin-top:16px"><button class="btn" data-action="export-ai">↓ ChatGPT update (.md)</button><button class="btn ghost" data-action="copy-ai">⧉ Copy ChatGPT update</button><button class="btn subtle" data-action="export-json">↓ Full data backup (.json)</button><button class="btn ghost" data-action="open-import">↑ Import previous backup</button></div><div class="divider"></div><h3 style="margin:0 0 5px">What's in the full export?</h3><p class="privacy-notice">Your complete personal records, comments and series progress; the entire curated catalogue including every synopsis and recommendation justification; custom titles; preferences and a timestamp. JSON can be re-imported later without losing your data.</p><p class="privacy-notice">Stored locally on this browser. If you clear browser data, you may lose changes unless you export a backup. The app doesn't transmit your ratings to a server.</p></div></section></div>`}
function addModal(){return `<div class="modal-shade" data-shade="true"><section class="modal" role="dialog" aria-modal="true" aria-label="Add a title"><button class="modal-close" data-action="close-modal">×</button><div class="modal-inner" style="padding-top:38px"><div class="eyebrow">YOUR OWN DISCOVERIES</div><h2 style="font-size:30px;letter-spacing:-1px;margin:8px 0">Add a film or series</h2><p class="privacy-notice">Search the existing catalogue first. For a brand-new entry, you can provide a short plot and why it belongs here. You can ask ChatGPT for a tailored justification when sharing your next export.</p><form id="customForm" class="custom-form"><div class="full"><label class="form-label">Title</label><input class="field" name="title" required maxlength="150" placeholder="Film or series name"></div><div><label class="form-label">Format</label><select name="type" class="select"><option value="film">Film</option><option value="tv">TV series</option></select></div><div><label class="form-label">Release year</label><input class="field" name="year" type="number" min="1880" max="2100" value="2020" required></div><div class="full"><label class="form-label">Short synopsis (optional)</label><textarea class="comment" name="synopsis" maxlength="1000" style="min-height:60px" placeholder="What happens in it?"></textarea></div><div class="full"><label class="form-label">Why it interests you (optional)</label><textarea class="comment" name="why" maxlength="1000" style="min-height:60px" placeholder="What made you add this to your list?"></textarea></div><div class="full"><button type="submit" class="btn wide">+ Add to my library</button></div></form></div></section></div>`}
function searchModal(){return `<div class="modal-shade" data-shade="true"><section class="modal" role="dialog" aria-modal="true" aria-label="Search"><button class="modal-close" data-action="close-modal">×</button><div class="modal-inner" style="padding-top:38px"><div class="eyebrow">FIND A TITLE</div><h2 style="font-size:28px;margin:8px 0 17px">Search the collection</h2><input class="field searchbar-big" id="globalSearch" placeholder="Try a title, mood, or plot…" autofocus><div id="globalResults" style="margin-top:15px"></div><div class="edit-params">${button('open-add','+ Add something missing','subtle')}</div></div></section></div>`}
function globalResults(q){q=q.trim().toLowerCase();let matches=!q?[]:ALL().filter(p=>[p.title,p.synopsis,p.why,p.year].join(' ').toLowerCase().includes(q)).slice(0,14);return matches.length?matches.map(p=>`<div class="list-row"><span class="dot"></span><div class="grow"><strong>${safe(p.title)}</strong><small>${safe(p.year)} · ${p.type==='film'?'Film':'TV'} · ${safe(p.genres.slice(0,2).join(', '))}</small></div><button data-open="${safe(p.id)}">Open ↗</button></div>`).join(''):`<p class="privacy-notice">${q?'No matches. You can add it manually.':'Start typing to search films, series and their descriptions.'}</p>`}
function currentExport(){return {app:'The Cut',version:1,exportedAt:new Date().toISOString(),profile:{summary:BASE_PROFILE,additionalNotes:db.tasteNotes},providers:[...db.providers],entries:structuredClone(db.entries),customTitles:structuredClone(db.custom),catalogue:structuredClone(CATALOGUE),stats:{titles:ALL().length,rated:ratedCount(),watched:statCount('watched'),seen:statCount('seen'),sampled:statCount('sampled'),wantToWatch:statCount('want')},storage:'local-first'};}
function exportMarkdown(){let all=ALL();let lines=['# The Cut — full viewing update for ChatGPT','',`Generated: ${new Date().toISOString()}`,'','## Taste profile',BASE_PROFILE,'',`Additional notes: ${db.tasteNotes||'(none)'}`,'',`Streaming subscriptions: ${db.providers.join(', ')}`,'','## Viewing records','This is your personal data. Do not infer that watched implies liked, or that a paused title was disliked. Preserve each status and comment.',''];
let touched=all.filter(p=>{let e=entry(p.id);return e.status!=='none'||e.rating!=='none'||e.note||e.progress||e.reason});let groups=[['Watched / finished',p=>entry(p.id).status==='watched'],['Seen, completion unknown',p=>entry(p.id).status==='seen'],['Tried / sampled',p=>entry(p.id).status==='sampled'],['Currently watching',p=>entry(p.id).status==='watching'],['Paused',p=>entry(p.id).status==='paused'],['Dropped',p=>entry(p.id).status==='dropped'],['Not continuing',p=>entry(p.id).status==='not-continuing'],['Not interested',p=>entry(p.id).status==='not-interested'],['Unwatched watchlist',p=>entry(p.id).status==='want'],['Rated or commented, no viewing status',p=>entry(p.id).status==='none']];for(let [label,pred] of groups){let ps=touched.filter(pred);if(!ps.length)continue;lines.push('### '+label+' ('+ps.length+')');for(let p of ps){let e=entry(p.id);lines.push(`- ${p.title} (${p.year}, ${p.type==='film'?'film':'TV'}) — ${RATING_LABEL[e.rating]||'Not rated'}${e.progress?' | Progress: '+e.progress:''}${e.reason?' | Stopping reason: '+e.reason:''}${e.note?' | Comment: '+e.note.replace(/\n/g,' / '):''}`)}lines.push('')}
lines.push('## Catalogue and remaining discoveries',`The full curated catalogue contains ${CATALOGUE.length} seed titles and ${db.custom.length} manually added titles. The 15 original unwatched recommendations are tracked under Unwatched watchlist above. Other untracked titles are discoverable in the app, not on the personal watchlist.`, '', '## Please use this update','Update my viewing preferences and watchlist. Preserve exact likes/dislikes, comments and incomplete-series statuses. Use my taste profile for future recommendations; ask for clarification if a comment is ambiguous. Do not treat any recommendation as watched simply because it exists in the catalogue.');return lines.join('\n');}
function download(text,name,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export created — keep it somewhere safe')}
function downloadJSON(){download(JSON.stringify(currentExport(),null,2),'the-cut-full-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied — paste it into ChatGPT')}catch(e){let el=document.createElement('textarea');el.value=t;el.style='position:fixed;top:0;left:0;z-index:999999;opacity:0;';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(x){toast('Clipboard blocked. Download the .md file instead.')}el.remove()}}
function openModal(id){let p=ALL().find(p=>p.id===id);if(!p)return;ui.modalId=id;ui.overlayName='detail';document.querySelector('#overlay').innerHTML=detail(p);document.body.style.overflow='hidden';}
function closeModal(){ui.modalId=null;ui.overlayName=null;document.querySelector('#overlay').innerHTML='';document.body.style.overflow='';}
function openOverlay(name){ui.overlayName=name;ui.modalId=null;document.querySelector('#overlay').innerHTML= name==='export'?exportModal():name==='add'?addModal():searchModal();document.body.style.overflow='hidden';if(name==='search')setTimeout(()=>document.querySelector('#globalSearch')?.focus(),70)}
function refreshModal(){if(ui.modalId){let p=ALL().find(p=>p.id===ui.modalId);if(p)document.querySelector('#overlay').innerHTML=detail(p)}}
function rerender(){document.querySelector('#crumbLabel').textContent=({home:'Tonight',discover:'Discover',library:'My library',taste:'My taste',tonight:'Tonight'}[ui.view]);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===ui.view));let v=document.querySelector('#view');if(ui.view==='home')v.innerHTML=home();if(ui.view==='library')v.innerHTML=library();if(ui.view==='taste')v.innerHTML=taste();if(ui.view==='tonight')v.innerHTML=tonight();if(ui.view==='discover')renderDiscover();}
function goto(view){ui.view=view;window.location.hash=view;rerender();window.scrollTo({top:0,behavior:'instant'})}
function setMood(m){ui.mood=m;rerender()}
function handleAction(action,el){switch(action){case'open-tonight':goto('tonight');break;case'go-discover':goto('discover');break;case'open-export':openOverlay('export');break;case'open-add':openOverlay('add');break;case'open-search':openOverlay('search');break;case'close-modal':closeModal();break;case'export-json':downloadJSON();break;case'export-ai':download(exportMarkdown(),'the-cut-chatgpt-update-'+new Date().toISOString().slice(0,10)+'.md','text/markdown');break;case'copy-ai':copyText(exportMarkdown());break;case'open-import':document.querySelector('#importFile').click();break;case'add-to-watchlist':{let id=el.dataset.id;update(id,{status:entry(id).status==='want'?'none':'want'});refreshModal();toast('Watchlist updated');break;}case'reset-filters':ui.search='';ui.genre='All';ui.lane='All';ui.mood='Any';ui.sort='curated';rerender();break;case'reroll':ui.pickExclude.push(...picks().map(p=>p.id));if(ui.pickExclude.length>50)ui.pickExclude=[];ui.pickRound++;rerender();break;}}
function sanitizeRecord(e){if(!e||typeof e!=='object')return null;return {status:STATUS.includes(e.status)?e.status:'none',rating:RATING.includes(e.rating)?e.rating:'none',note:String(e.note||'').slice(0,10000),progress:String(e.progress||'').slice(0,120),reason:String(e.reason||'').slice(0,140),source:String(e.source||'import').slice(0,60),updated:typeof e.updated==='string'?e.updated:new Date().toISOString()}}
function ingest(obj){if(!obj||typeof obj!=='object')throw Error('Not a valid backup');let rec=obj.entries||obj.userData;if(!rec||typeof rec!=='object'||Array.isArray(rec))throw Error('No watchlist records were found');let next={...db.entries};let imported=0;for(let [id,val] of Object.entries(rec)){let r=sanitizeRecord(val);if(r){next[id]=r;imported++}}let customs=Array.isArray(obj.customTitles)?obj.customTitles:Array.isArray(obj.custom)?obj.custom:[];let extCustom=customs.filter(p=>p&&/^custom-[\w-]+$/.test(p.id||'')&&['film','tv'].includes(p.type)&&p.title).slice(0,1500).map(p=>({...p,id:String(p.id),title:String(p.title).slice(0,150),year:Number(p.year)||2020,type:p.type,genres:Array.isArray(p.genres)?p.genres.map(x=>String(x).slice(0,60)).slice(0,8):['Other'],moods:Array.isArray(p.moods)?p.moods.map(x=>String(x).slice(0,40)).slice(0,8):['Any'],lane:'For you',synopsis:String(p.synopsis||'Personal addition. Synopsis not supplied.').slice(0,1000),why:String(p.why||'Added by you for personal tracking; tailored recommendation pending.').slice(0,1000),custom:true}));let seen=new Map(db.custom.map(x=>[x.id,x]));extCustom.forEach(p=>seen.set(p.id,p));db.entries=next;db.custom=[...seen.values()];if(obj.providers&&Array.isArray(obj.providers))db.providers=obj.providers.filter(x=>PROVIDERS.includes(x));if(obj.profile&&typeof obj.profile.additionalNotes==='string')db.tasteNotes=obj.profile.additionalNotes.slice(0,10000);else if(typeof obj.tasteNotes==='string')db.tasteNotes=obj.tasteNotes.slice(0,10000);persist();rerender();return imported;}
function addCustom(f){let title=String(f.get('title')||'').trim(),typ=String(f.get('type'));if(!title)throw Error('Add a title first');let existing=ALL().find(p=>p.type===typ&&p.title.toLowerCase()===title.toLowerCase());if(existing){closeModal();openModal(existing.id);toast('Already in the collection');return}let year=Number(f.get('year'));let id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);let p={id,title,year,type:typ,genres:['Other'],moods:['Any'],lane:'For you',synopsis:String(f.get('synopsis')||'').trim()||'Your personal addition. Add a short synopsis when you have one.',why:String(f.get('why')||'').trim()||'You added this to track your viewing. Ask ChatGPT to write a personalised justification with your next update.',custom:true};db.custom.push(p);update(id,{status:'want'});closeModal();rerender();openModal(id);toast('Title added to your library')}
// Delegated controls allow content to be regenerated without losing event bindings.
document.addEventListener('click',ev=>{let n=ev.target.closest('[data-open]');if(n){openModal(n.dataset.open);return}let v=ev.target.closest('[data-view]');if(v){if(v.dataset.library)ui.libraryTab=v.dataset.library;goto(v.dataset.view);return}let action=ev.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}let kd=ev.target.closest('[data-kind]');if(kd){ui.type=kd.dataset.kind;ui.genre='All';rerender();return}let mood=ev.target.closest('[data-mood]');if(mood){setMood(mood.dataset.mood);return}let lm=ev.target.closest('[data-library]');if(lm){ui.libraryTab=lm.dataset.library;goto('library');return}let tm=ev.target.closest('[data-tonight-mood]');if(tm){ui.tonightMood=tm.dataset.tonightMood;ui.pickRound=0;ui.pickExclude=[];rerender();return}let pro=ev.target.closest('[data-provider]');if(pro){let v=pro.dataset.provider;db.providers=db.providers.includes(v)?db.providers.filter(x=>x!==v):[...db.providers,v];persist();rerender();return}let col=ev.target.closest('[data-collection]');if(col){ui.mood=col.dataset.collection;ui.genre='All';ui.lane='All';goto('discover');return}if(ev.target.dataset.shade==='true'){closeModal();return}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='genreFilter'){ui.genre=t.value;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='laneFilter'){ui.lane=t.value;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='sortFilter'){ui.sort=t.value;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='pickerEnergy'){ui.energy=t.value;rerender()}if(t.id==='pickerTime'){ui.time=t.value;rerender()}if(t.id==='pickerWho'){ui.who=t.value;rerender()}if(t.id==='entryStatus'){update(t.dataset.id,{status:t.value});refreshModal();toast('Status saved')}if(t.id==='entryRating'){update(t.dataset.id,{rating:t.value});refreshModal();toast('Rating saved')}if(t.id==='entryReason'){update(t.dataset.id,{reason:t.value});toast('Reason saved')}});
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='searchInput'){ui.search=t.value;document.querySelector('#discoveryResults').innerHTML=discoverResults()}if(t.id==='entryNote')update(t.dataset.id,{note:t.value});if(t.id==='entryProgress')update(t.dataset.id,{progress:t.value});if(t.id==='tasteNotes'){db.tasteNotes=t.value;persist()}if(t.id==='customSynopsis'||t.id==='customWhy'){let p=db.custom.find(x=>x.id===t.dataset.id);if(p){p[t.id==='customSynopsis'?'synopsis':'why']=t.value;persist()}}if(t.id==='globalSearch'){document.querySelector('#globalResults').innerHTML=globalResults(t.value)}});
document.addEventListener('submit',ev=>{if(ev.target.id==='customForm'){ev.preventDefault();try{addCustom(new FormData(ev.target))}catch(x){toast(x.message)}}});
document.querySelector('#importFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{if(file.size>10_000_000)throw Error('File too large for a personal backup');let obj=JSON.parse(await file.text());let count=ingest(obj);closeModal();toast(`Imported ${count} personal records`)}catch(e){toast('Import failed: '+e.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('media-card')){e.preventDefault();openModal(e.target.dataset.open)}});
window.addEventListener('hashchange',()=>{let route=location.hash.replace('#','');if(['home','discover','library','taste','tonight'].includes(route)&&ui.view!==route){ui.view=route;rerender()}});
let init=location.hash.replace('#','');if(['home','discover','library','taste','tonight'].includes(init))ui.view=init;else history.replaceState(null,'','#home');
rerender();persist();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.__THE_CUT_TEST__={catalogue:CATALOGUE,db,score,markdown:exportMarkdown,currentExport};
})();
